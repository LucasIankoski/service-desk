spring:
  task:
    scheduling:
      enabled: false
  datasource:
    url: jdbc:h2:mem:service_desk;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: none
  mail:
    host: localhost
  session:
    jdbc:
      initialize-schema: never
app:
  encryption-key: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
  attachments-path: ${java.io.tmpdir}/service-desk-tests
  clamav:
    enabled: false
