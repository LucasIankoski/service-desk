databaseChangeLog:
  - changeSet:
      id: 016-commitment-collaborator
      author: service-desk-team
      changes:
        - addColumn:
            tableName: agenda_occurrence
            columns:
              - column: { name: collaborator_id, type: varchar(36) }
        - addForeignKeyConstraint:
