databaseChangeLog:
- changeSet:
    id: 017-multi-unit
    author: service-desk-team
    comment: Unidades escolares, vínculos por unidade e coluna unit_id nas tabelas de cada unidade.
    changes:
    - createTable:
        tableName: school_unit
        columns:
        - column: { name: id, type: varchar(36), constraints: { primaryKey: true, nullable: false } }
        - column: { name: code, type: varchar(8), constraints: { nullable: false, unique: true, uniqueConstraintName: uk_unit_code } }
        - column: { name: name, type: varchar(160), constraints: { nullable: false, unique: true, uniqueConstraintName: uk_unit_name } }
        - column: { name: support_email, type: varchar(254) }
        - column: { name: support_phone, type: varchar(40) }
        - column: { name: active, type: boolean, defaultValueBoolean: true, constraints: { nullable: false } }
        - column: { name: row_version, type: bigint, defaultValueNumeric: 0, constraints: { nullable: false } }
        - column: { name: created_at, type: timestamp, defaultValueComputed: CURRENT_TIMESTAMP, constraints: { nullable: false } }
        - column: { name: updated_at, type: timestamp, defaultValueComputed: CURRENT_TIMESTAMP, constraints: { nullable: false } }
    - insert:
        tableName: school_unit
        columns:
        - column: { name: id, value: 0f5d8c2e-6a41-4b7e-9c1d-3e2a7b9f4d10 }
        - column: { name: code, value: SD }
        - column: { name: name, value: Unidade principal }
        - column: { name: active, valueBoolean: true }
        - column: { name: row_version, valueNumeric: 0 }
        - column: { name: created_at, valueComputed: CURRENT_TIMESTAMP }
        - column: { name: updated_at, valueComputed: CURRENT_TIMESTAMP }
    - sql:
        sql: >-
          UPDATE school_unit SET
          name = (SELECT institution_name FROM app_settings WHERE id = 1),
          support_email = (SELECT support_email FROM app_settings WHERE id = 1),
          support_phone = (SELECT support_phone FROM app_settings WHERE id = 1)
          WHERE id = '0f5d8c2e-6a41-4b7e-9c1d-3e2a7b9f4d10' AND EXISTS (SELECT 1 FROM app_settings WHERE id = 1)
    - createTable:
        tableName: unit_membership
        columns:
        - column: { name: user_id, type: varchar(36), constraints: { nullable: false } }
        - column: { name: unit_id, type: varchar(36), constraints: { nullable: false } }
        - column: { name: role_name, type: varchar(32), constraints: { nullable: false } }
    - addPrimaryKey:
        tableName: unit_membership
        columnNames: user_id, unit_id, role_name
        constraintName: pk_unit_membership
    - createIndex:
        tableName: unit_membership
        indexName: ix_unit_membership_unit
        columns:
        - column: { name: unit_id }
        - column: { name: role_name }
    - addForeignKeyConstraint:
        baseTableName: unit_membership
        baseColumnNames: user_id
        referencedTableName: user_account
        referencedColumnNames: id
        constraintName: fk_unit_membership_user
    - addForeignKeyConstraint:
        baseTableName: unit_membership
        baseColumnNames: unit_id
        referencedTableName: school_unit
        referencedColumnNames: id
        constraintName: fk_unit_membership_unit
    - sql:
        sql: >-
          INSERT INTO unit_membership (user_id, unit_id, role_name)
          SELECT user_id, '0f5d8c2e-6a41-4b7e-9c1d-3e2a7b9f4d10', role_name FROM user_role
          WHERE role_name IN ('REQUESTER', 'AGENT', 'MANAGER')
    - sql:
        sql: DELETE FROM user_role WHERE role_name IN ('REQUESTER', 'AGENT', 'MANAGER')
    - createTable:
        tableName: unit_ticket_counter
        columns:
        - column: { name: unit_id, type: varchar(36), constraints: { nullable: false } }
        - column: { name: counter_year, type: int, constraints: { nullable: false } }
        - column: { name: next_value, type: bigint, constraints: { nullable: false } }
        - column: { name: row_version, type: bigint, defaultValueNumeric: 0, constraints: { nullable: false } }
    - addPrimaryKey:
        tableName: unit_ticket_counter
        columnNames: unit_id, counter_year
        constraintName: pk_unit_ticket_counter
    - addForeignKeyConstraint:
        baseTableName: unit_ticket_counter
        baseColumnNames: unit_id
        referencedTableName: school_unit
        referencedColumnNames: id
        constraintName: fk_ticket_counter_unit
    - sql:
        sql: >-
          INSERT INTO unit_ticket_counter (unit_id, counter_year, next_value, row_version)
          SELECT '0f5d8c2e-6a41-4b7e-9c1d-3e2a7b9f4d10', counter_year, next_value, row_version FROM ticket_counter
