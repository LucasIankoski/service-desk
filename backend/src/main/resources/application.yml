spring:
  application:
    name: service-desk-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/service_desk}
    username: ${DB_USERNAME:service_desk}
    password: ${DB_PASSWORD:service_desk}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:15}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 10000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        type:
          preferred_uuid_jdbc_type: VARCHAR
        order_inserts: true
        order_updates: true
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yml
  session:
    jdbc:
      initialize-schema: never
      cleanup-cron: "0 */15 * * * *"
    timeout: 30m
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 130MB
  mvc:
    problemdetails:
      enabled: true
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 200

server:
  port: ${APP_PORT:8080}
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        name: SERVICE_DESK_SESSION
        http-only: true
        secure: ${SESSION_SECURE:false}
        same-site: lax
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  structured:
    format:
      console: ecs
  level:
    org.springframework.security: INFO

app:
  db-vendor: ${DB_VENDOR:postgresql}
  public-base-url: ${PUBLIC_BASE_URL:http://localhost}
  encryption-key: ${APP_ENCRYPTION_KEY:}
  attachments-path: ${ATTACHMENTS_PATH:./data/attachments}
  absolute-session-timeout: 12h
  clamav:
    enabled: ${CLAMAV_ENABLED:false}
    host: ${CLAMAV_HOST:localhost}
    port: ${CLAMAV_PORT:3310}
    timeout: 10s
  bootstrap:
    admin-email: ${APP_BOOTSTRAP_ADMIN_EMAIL:}
    admin-password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:}
