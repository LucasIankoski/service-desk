name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Test backend
        working-directory: backend
        run: ./mvnw -B verify
      - name: Upload backend SBOM
        uses: actions/upload-artifact@v5
        with:
          name: backend-cyclonedx
          path: backend/target/classes/META-INF/sbom/application.cdx.json

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Test
        working-directory: frontend
        run: npm run test
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium firefox webkit
      - name: End-to-end and accessibility tests
        working-directory: frontend
        run: npm run test:e2e
      - name: Generate frontend SBOM
        working-directory: frontend
        run: npm sbom --sbom-format cyclonedx > frontend-bom.json
      - name: Upload frontend SBOM
        uses: actions/upload-artifact@v5
        with:
          name: frontend-cyclonedx
          path: frontend/frontend-bom.json

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      matrix:
        language: [java-kotlin, javascript-typescript]
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v5
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/autobuild@v5
      - uses: github/codeql-action/analyze@v5

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/dependency-review-action@v5

  filesystem-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: gitleaks/gitleaks-action@v2
      - uses: aquasecurity/trivy-action@0.34.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"

  zap-baseline:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - name: Prepare local secret
        run: |
          mkdir -p secrets
          openssl rand -base64 32 > secrets/app_encryption_key
      - name: Boot application
        run: |
          cp .env.example .env
          docker compose --profile postgres up --build -d
      - name: ZAP baseline
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: https://localhost:8443
          allow_issue_writing: false
      - name: Shutdown
        if: always()
        run: docker compose --profile postgres down -v
