name: central-servicos

services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-https://localhost:8443}
      API_UPSTREAM: api:8080
    ports:
      - "${HTTPS_PORT:-8443}:8443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider --no-check-certificate https://localhost:8443/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DB_VENDOR: ${DB_VENDOR:-postgresql}
      DB_URL: ${DB_URL:-jdbc:postgresql://postgres:5432/service_desk}
      DB_USERNAME: ${DB_USERNAME:-service_desk}
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      APP_BOOTSTRAP_ADMIN_EMAIL: ${APP_BOOTSTRAP_ADMIN_EMAIL:-}
      APP_BOOTSTRAP_ADMIN_PASSWORD: ${APP_BOOTSTRAP_ADMIN_PASSWORD:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://localhost:8443}
      APP_ENCRYPTION_KEY_FILE: /run/secrets/app_encryption_key
      ATTACHMENTS_PATH: /var/lib/service-desk/attachments
      CLAMAV_ENABLED: ${CLAMAV_ENABLED:-true}
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      SESSION_SECURE: "true"
    secrets:
      - app_encryption_key
    volumes:
      - attachments:/var/lib/service-desk/attachments
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      clamav:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness"]
      interval: 30s
      timeout: 5s
      retries: 5

  clamav:
    image: clamav/clamav:1.4
    user: "clamav"
    volumes:
      - clamav_data:/var/lib/clamav
    read_only: true
    tmpfs:
      - /tmp:uid=100,gid=101,mode=1777
      - /run/clamav:uid=100,gid=101,mode=0775
      - /var/lock:uid=100,gid=101,mode=0775
      - /var/log/clamav:uid=100,gid=101,mode=0775
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --version >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10

  postgres:
    image: postgres:18-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_DB: service_desk
      POSTGRES_USER: service_desk
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U service_desk -d service_desk"]
      interval: 10s
      timeout: 5s
      retries: 10

  mysql:
    image: mysql:8.4
    profiles: ["mysql"]
    environment:
      MYSQL_DATABASE: service_desk
      MYSQL_USER: service_desk
      MYSQL_PASSWORD: ${DB_PASSWORD:-change-me}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-root}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    profiles: ["sqlserver"]
    user: "10001:0"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Change_this_password_123}
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P $${MSSQL_SA_PASSWORD} -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20

  oracle:
    image: container-registry.oracle.com/database/enterprise:19.3.0.0
    profiles: ["oracle"]
    user: "oracle"
    environment:
      ORACLE_PWD: ${ORACLE_PWD:-Change_this_password_123}
    volumes:
      - oracle_data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD-SHELL", "echo 'select 1 from dual;' | sqlplus -s system/$${ORACLE_PWD}@localhost:1521/ORCLCDB || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 30

secrets:
  app_encryption_key:
    file: ./secrets/app_encryption_key

volumes:
  attachments:
  caddy_data:
  caddy_config:
  clamav_data:
  postgres_data:
  mysql_data:
  sqlserver_data:
  oracle_data:
