openapi: 3.1.0
info:
  title: Central de Serviços API
  version: 1.0.0
  description: API REST da Central de Serviços v1. Datas são UTC em ISO-8601.
servers:
  - url: /api/v1
security:
  - sessionCookie: []

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: SERVICE_DESK_SESSION
    csrfHeader:
      type: apiKey
      in: header
      name: X-XSRF-TOKEN
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
    Size:
      name: size
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 20 }
  responses:
    BadRequest:
      description: Requisição inválida.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetail" }
    Unauthorized:
      description: Sessão ausente, inválida ou expirada.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetail" }
    Forbidden:
      description: Perfil ou escopo insuficiente.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetail" }
    Conflict:
      description: Conflito de unicidade ou versão otimista.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetail" }
    Unprocessable:
      description: Regra de negócio não satisfeita.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetail" }
  schemas:
    Role:
      type: string
      enum: [REQUESTER, AGENT, MANAGER, ADMIN]
    TicketStatus:
      type: string
      enum: [OPEN, IN_PROGRESS, WAITING_REQUESTER, RESOLVED]
    Priority:
      type: string
      enum: [LOW, NORMAL, HIGH, CRITICAL]
    CommentVisibility:
      type: string
      enum: [PUBLIC, INTERNAL]
    NotificationType:
      type: string
      enum: [ASSIGNED, PUBLIC_COMMENT, MENTION, STATUS_CHANGED, DEADLINE_SOON, OVERDUE]
    AttachmentScanStatus:
      type: string
      enum: [CLEAN, INFECTED, ERROR]
    AgendaItemKind:
      type: string
      enum: [INTERNAL_DEMAND, INSTITUTION_EVENT]
    AgendaItemStatus:
      type: string
      enum: [PENDING, COMPLETED]
    Theme:
      type: object
      required: [primaryColor, accentColor, sidebarColor, canvasColor]
      properties:
        primaryColor: { type: string, pattern: "^#[0-9A-Fa-f]{6}$" }
        accentColor: { type: string, pattern: "^#[0-9A-Fa-f]{6}$" }
        sidebarColor: { type: string, pattern: "^#[0-9A-Fa-f]{6}$" }
        canvasColor: { type: string, pattern: "^#[0-9A-Fa-f]{6}$" }
    PublicSettings:
      type: object
      required: [institutionName, timezoneName, theme, version, updatedAt]
      properties:
        institutionName: { type: string }
        supportEmail: { type: [string, "null"], format: email }
        supportPhone: { type: [string, "null"] }
        timezoneName: { type: string }
        theme: { $ref: "#/components/schemas/Theme" }
        loginBackgroundUrl: { type: [string, "null"] }
        version: { type: integer, format: int64 }
        updatedAt: { type: string, format: date-time }
    SmtpSettings:
      type: object
      required: [tls, passwordConfigured]
      properties:
        host: { type: [string, "null"] }
        port: { type: [integer, "null"] }
        tls: { type: boolean }
        fromName: { type: [string, "null"] }
        fromAddress: { type: [string, "null"], format: email }
        username: { type: [string, "null"] }
        passwordConfigured: { type: boolean }
    AdminSettings:
      type: object
      required: [institutionName, timezoneName, attachmentLimitMb, reopenDays, deadlineWarningHours, theme, loginBackgroundConfigured, smtp, version, updatedAt]
      properties:
        institutionName: { type: string }
        supportEmail: { type: [string, "null"], format: email }
        supportPhone: { type: [string, "null"] }
        timezoneName: { type: string }
        attachmentLimitMb: { type: integer }
        reopenDays: { type: integer }
        deadlineWarningHours: { type: integer }
        theme: { $ref: "#/components/schemas/Theme" }
        loginBackgroundConfigured: { type: boolean }
        smtp: { $ref: "#/components/schemas/SmtpSettings" }
        version: { type: integer, format: int64 }
        updatedAt: { type: string, format: date-time }
    Me:
      type: object
      required: [id, email, displayName, roles, passwordChangeRequired]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: string }
        roles:
          type: array
          uniqueItems: true
          items: { $ref: "#/components/schemas/Role" }
        passwordChangeRequired: { type: boolean }
    User:
      type: object
      required: [id, email, displayName, roles, active, passwordChangeRequired, anonymized, createdAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: string }
        roles:
          type: array
          uniqueItems: true
          items: { $ref: "#/components/schemas/Role" }
        active: { type: boolean }
        passwordChangeRequired: { type: boolean }
        anonymized: { type: boolean }
        createdAt: { type: string, format: date-time }
    Assignee:
      type: object
      required: [id, displayName]
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string }
    AgendaItem:
      type: object
      required: [id, kind, title, description, location, assigneeId, assigneeName, status, startAt, endAt, allDay, version, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/AgendaItemKind" }
        title: { type: string }
        description: { type: [string, "null"] }
        location: { type: [string, "null"] }
        assigneeId: { type: [string, "null"], format: uuid }
        assigneeName: { type: [string, "null"] }
        status:
          oneOf:
            - { $ref: "#/components/schemas/AgendaItemStatus" }
            - { type: "null" }
        startAt: { type: string, format: date-time, description: Início inclusivo em UTC. }
        endAt: { type: string, format: date-time, description: Término exclusivo em UTC. }
        allDay: { type: boolean }
        version: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    InstitutionEventInput:
      type: object
      required: [kind, title, startAt, endAt, allDay]
      properties:
        kind: { type: string, const: INSTITUTION_EVENT }
        title: { type: string, minLength: 1, maxLength: 160 }
        description: { type: [string, "null"], maxLength: 4000 }
        location: { type: [string, "null"], maxLength: 200 }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        allDay: { type: boolean }
      additionalProperties: false
    InternalDemandInput:
      type: object
      required: [kind, title, startAt, endAt, allDay]
      properties:
        kind: { type: string, const: INTERNAL_DEMAND }
        title: { type: string, minLength: 1, maxLength: 160 }
        description: { type: [string, "null"], maxLength: 4000 }
        assigneeId: { type: [string, "null"], format: uuid }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        allDay: { type: boolean }
      additionalProperties: false
    AgendaItemCreate:
      oneOf:
        - { $ref: "#/components/schemas/InstitutionEventInput" }
        - { $ref: "#/components/schemas/InternalDemandInput" }
      discriminator:
        propertyName: kind
        mapping:
          INSTITUTION_EVENT: "#/components/schemas/InstitutionEventInput"
          INTERNAL_DEMAND: "#/components/schemas/InternalDemandInput"
    AgendaItemUpdate:
      type: object
      required: [title, startAt, endAt, allDay, version]
      properties:
        title: { type: string, minLength: 1, maxLength: 160 }
        description: { type: [string, "null"], maxLength: 4000 }
        location: { type: [string, "null"], maxLength: 200 }
        assigneeId: { type: [string, "null"], format: uuid }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        allDay: { type: boolean }
        version: { type: integer, format: int64 }
    CreatedUser:
      type: object
      required: [user, temporaryPassword]
      properties:
        user: { $ref: "#/components/schemas/User" }
        temporaryPassword: { type: string, writeOnly: true }
    Category:
      type: object
      required: [id, name, active, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
    Attachment:
      type: object
      required: [id, ticketId, originalName, mediaType, fileSize, sha256, scanStatus, visibility, createdAt]
      properties:
        id: { type: string, format: uuid }
        ticketId: { type: string, format: uuid }
        commentId: { type: [string, "null"], format: uuid }
        originalName: { type: string }
        mediaType: { type: string }
        fileSize: { type: integer, format: int64 }
        sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
        scanStatus: { $ref: "#/components/schemas/AttachmentScanStatus" }
        visibility: { $ref: "#/components/schemas/CommentVisibility" }
        createdAt: { type: string, format: date-time }
    TicketComment:
      type: object
      required: [id, authorId, body, visibility, createdAt, attachments]
      properties:
        id: { type: string, format: uuid }
        authorId: { type: string, format: uuid }
        authorName: { type: [string, "null"] }
        body: { type: string }
        visibility: { $ref: "#/components/schemas/CommentVisibility" }
        createdAt: { type: string, format: date-time }
        attachments:
          type: array
          items: { $ref: "#/components/schemas/Attachment" }
    TicketSummary:
      type: object
      required: [id, publicNumber, subject, status, priority, requesterId, createdAt, updatedAt, version]
      properties:
        id: { type: string, format: uuid }
        publicNumber: { type: string, example: SD-2026-000001 }
        subject: { type: string }
        status: { $ref: "#/components/schemas/TicketStatus" }
        priority: { $ref: "#/components/schemas/Priority" }
        requesterId: { type: string, format: uuid }
        requesterName: { type: [string, "null"] }
        assigneeId: { type: [string, "null"], format: uuid }
        assigneeName: { type: [string, "null"] }
        categoryId: { type: [string, "null"], format: uuid }
        categoryName: { type: [string, "null"] }
        dueAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, format: int64 }
    TicketDetail:
      allOf:
        - { $ref: "#/components/schemas/TicketSummary" }
        - type: object
          required: [description, attachments, comments]
          properties:
            description: { type: string }
            attachments:
              type: array
              items: { $ref: "#/components/schemas/Attachment" }
            comments:
              type: array
              items: { $ref: "#/components/schemas/TicketComment" }
    Notification:
      type: object
      required: [id, type, title, message, read, createdAt]
      properties:
        id: { type: string, format: uuid }
        ticketId: { type: [string, "null"], format: uuid }
        type: { $ref: "#/components/schemas/NotificationType" }
        title: { type: string }
        message: { type: string }
        read: { type: boolean }
        createdAt: { type: string, format: date-time }
    AuditEvent:
      type: object
      required: [id, action, entityType, createdAt]
      properties:
        id: { type: string, format: uuid }
        actorId: { type: [string, "null"], format: uuid }
        action: { type: string }
        entityType: { type: string }
        entityId: { type: [string, "null"] }
        details: { type: [string, "null"] }
        correlationId: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
    TicketPage:
      type: object
      required: [content, number, size, totalElements, totalPages]
      properties:
        content: { type: array, items: { $ref: "#/components/schemas/TicketSummary" } }
        number: { type: integer }
        size: { type: integer }
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer }
    UserPage:
      type: object
      required: [content, number, size, totalElements, totalPages]
      properties:
        content: { type: array, items: { $ref: "#/components/schemas/User" } }
        number: { type: integer }
        size: { type: integer }
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer }
    NotificationPage:
      type: object
      required: [content, number, size, totalElements, totalPages]
      properties:
        content: { type: array, items: { $ref: "#/components/schemas/Notification" } }
        number: { type: integer }
        size: { type: integer }
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer }
    AuditPage:
      type: object
      required: [content, number, size, totalElements, totalPages]
      properties:
        content: { type: array, items: { $ref: "#/components/schemas/AuditEvent" } }
        number: { type: integer }
        size: { type: integer }
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer }
    ProblemDetail:
      type: object
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string, format: uri }
        correlationId: { type: [string, "null"] }
        errors: { type: object, additionalProperties: { type: string } }

paths:
  /public/settings:
    get:
      security: []
      summary: Obtém tema e dados públicos do login.
      responses:
        "200":
          description: Configuração pública.
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicSettings" }
  /public/settings/login-background:
    get:
      security: []
      summary: Obtém a imagem configurada para o login.
      responses:
        "200":
          description: Imagem JPG, PNG ou WebP.
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        "404": { description: Imagem não configurada. }
  /auth/csrf:
    get:
      security: []
      summary: Emite o token CSRF e seu cookie correspondente.
      responses:
        "200":
          description: Token emitido.
          content:
            application/json:
              schema:
                type: object
                required: [headerName, token]
                properties:
                  headerName: { type: string }
                  token: { type: string }
  /auth/session:
    post:
      security: [{ csrfHeader: [] }]
      summary: Cria uma sessão server-side.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "200":
          description: Sessão criada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { description: Limite de tentativas excedido. }
    delete:
      security: [{ sessionCookie: [], csrfHeader: [] }]
      summary: Encerra a sessão atual.
      responses:
        "204": { description: Sessão encerrada. }
  /auth/me:
    get:
      summary: Obtém o usuário autenticado.
      responses:
        "200":
          description: Sessão atual.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /auth/password/change:
    post:
      security: [{ sessionCookie: [], csrfHeader: [] }]
      summary: Troca a senha do usuário autenticado.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, minLength: 8, maxLength: 128 }
      responses:
        "204": { description: Senha alterada. }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /auth/password/forgot:
    post:
      security: [{ csrfHeader: [] }]
      summary: Solicita recuperação sem revelar se a conta existe.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "204": { description: Solicitação processada. }
  /auth/password/reset:
    post:
      security: [{ csrfHeader: [] }]
      summary: Redefine a senha com token de uso único.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string }
                password: { type: string, minLength: 8, maxLength: 128 }
      responses:
        "204": { description: Senha redefinida. }
        "400": { $ref: "#/components/responses/BadRequest" }
  /categories:
    get:
      summary: Lista categorias ativas.
      responses:
        "200":
          description: Categorias ativas.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Category" } }
  /users/assignees:
    get:
      summary: Lista responsáveis ativos para a fila.
      responses:
        "200":
          description: Diretório operacional mínimo.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Assignee" } }
        "403": { $ref: "#/components/responses/Forbidden" }
  /users/managers:
    get:
      summary: Lista Administrativos ativos disponíveis como responsáveis de demandas internas.
      responses:
        "200":
          description: Diretório mínimo de Administrativos.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Assignee" } }
        "403": { $ref: "#/components/responses/Forbidden" }
  /agenda/items:
    get:
      summary: Lista itens sobrepostos ao período, filtrados pelo perfil no banco.
      description: MANAGER recebe eventos e demandas internas; REQUESTER recebe somente eventos institucionais.
      parameters:
        - name: start
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: end
          in: query
          required: true
          description: Limite exclusivo do período consultado.
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Itens visíveis em ordem cronológica.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/AgendaItem" } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Unprocessable" }
    post:
      security: [{ sessionCookie: [], csrfHeader: [] }]
      summary: Cria evento institucional ou demanda interna; exige MANAGER.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgendaItemCreate" }
      responses:
        "201":
          description: Item criado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgendaItem" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /agenda/items/{id}:
    patch:
      security: [{ sessionCookie: [], csrfHeader: [] }]
      summary: Atualiza os campos do item sem alterar seu tipo; exige MANAGER.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgendaItemUpdate" }
      responses:
        "200":
          description: Item atualizado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgendaItem" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Item não encontrado. }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
    delete:
      security: [{ sessionCookie: [], csrfHeader: [] }]
      summary: Exclui permanentemente um item; exige MANAGER.
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - name: version
          in: query
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "204": { description: Item excluído. }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Item não encontrado. }
        "409": { $ref: "#/components/responses/Conflict" }
  /agenda/items/{id}/status:
    patch:
      security: [{ sessionCookie: [], csrfHeader: [] }]
      summary: Conclui ou reabre uma demanda interna; exige MANAGER.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status, version]
              properties:
                status: { $ref: "#/components/schemas/AgendaItemStatus" }
                version: { type: integer, format: int64 }
      responses:
        "200":
          description: Andamento atualizado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgendaItem" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Item não encontrado. }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /tickets:
    get:
      summary: Lista solicitações conforme o escopo do usuário.
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Size" }
        - { name: sort, in: query, schema: { type: string, example: "updatedAt,desc" } }
        - { name: number, in: query, schema: { type: string } }
        - { name: subject, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/TicketStatus" } }
        - { name: priority, in: query, schema: { $ref: "#/components/schemas/Priority" } }
        - { name: categoryId, in: query, schema: { type: string, format: uuid } }
        - { name: assigneeId, in: query, schema: { type: string, format: uuid } }
        - { name: dueAfter, in: query, schema: { type: string, format: date-time } }
        - { name: dueBefore, in: query, schema: { type: string, format: date-time } }
      responses:
        "200":
          description: Página estável de solicitações.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TicketPage" }
    post:
      security: [{ sessionCookie: [], csrfHeader: [] }]
      summary: Abre uma solicitação com até cinco anexos.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [metadata]
              properties:
                metadata:
                  type: object
                  required: [subject, description]
                  properties:
                    subject: { type: string, maxLength: 160 }
                    description: { type: string, maxLength: 8000 }
                    categoryId: { type: [string, "null"], format: uuid }
                files: { type: array, maxItems: 5, items: { type: string, format: binary } }
      responses:
        "200":
          description: Solicitação criada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TicketDetail" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /tickets/{id}:
    get:
      summary: Detalha uma solicitação respeitando ownership e notas internas.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Detalhe da solicitação.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TicketDetail" }
        "403": { $ref: "#/components/responses/Forbidden" }
