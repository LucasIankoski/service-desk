openapi: 3.1.0
info:
  title: Central de Serviços API
  version: 1.0.0
  description: API REST da Central de Serviços v1. Instantes são UTC em ISO-8601; datas de ocorrências são datas civis da instituição.
servers:
  - url: /api/v1
security:
  - sessionCookie: []

components:
  requestBodies:
    ActivityRecordUpload:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required: [metadata]
            properties:
              metadata: { $ref: '#/components/schemas/ActivityRecordInput' }
              files:
                type: array
                maxItems: 50
                items: { type: string, format: binary }
                description: JPG/PNG/WebP. Limite por foto configurado; até 100 MiB por envio e 60 megapixels por imagem. Total final entre 1 e 50 fotos.
          encoding:
            metadata: { contentType: application/json }
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: SERVICE_DESK_SESSION
    csrfHeader:
      type: apiKey
      in: header
      name: X-XSRF-TOKEN
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
    Size:
      name: size
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 20 }
  responses:
    BadRequest:
      description: Requisição inválida.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetail" }
    Unauthorized:
      description: Sessão ausente, inválida ou expirada.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetail" }
    Forbidden:
      description: Perfil ou escopo insuficiente.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetail" }
    Conflict:
      description: Conflito de unicidade ou versão otimista.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetail" }
    Unprocessable:
      description: Regra de negócio não satisfeita.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetail" }
  schemas:
    ProjectRun:
      type: object
      required: [text, bold]
      properties:
        text: { type: string, maxLength: 40000 }
        bold: { type: boolean }
    ProjectBlock:
      type: object
      required: [type, runs]
      properties:
        type: { type: string, enum: [PARAGRAPH, BULLET, HEADING] }
        runs: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/ProjectRun' } }
    ProjectRichText:
      type: object
      description: Até 40.000 caracteres no total. Blocos BULLET consecutivos formam uma lista. HEADING preserva subtítulos históricos. O formulário usa texto simples e não interpreta HTML.
      required: [blocks]
      properties:
        blocks: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/ProjectBlock' } }
    ProjectActivity:
      type: object
      description: O formulário simplificado envia um único item, com date nulo e title vazio, contendo todo o desenvolvimento. Atividades históricas com data e título continuam aceitas e preservadas.
      required: [title, description]
      properties:
        date: { type: [string, "null"], format: date }
        title: { type: string, maxLength: 300 }
        description: { $ref: '#/components/schemas/ProjectRichText' }
    ProjectCreate:
      type: object
      required: [title, startDate, endDate]
      properties:
        title: { type: string, minLength: 1, maxLength: 300 }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
    ProjectInput:
      allOf:
        - $ref: '#/components/schemas/ProjectCreate'
        - type: object
          required: [version, ageRange, teacherIds, generalObjective, specificObjectives, activities, conclusion]
          properties:
            version: { type: integer, format: int64 }
            ageRange: { type: string, maxLength: 200 }
            teacherIds: { type: array, maxItems: 100, items: { type: string, format: uuid } }
            generalObjective: { $ref: '#/components/schemas/ProjectRichText' }
            specificObjectives: { type: array, maxItems: 100, items: { type: string, maxLength: 2000 } }
            activities: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/ProjectActivity' } }
            conclusion: { $ref: '#/components/schemas/ProjectRichText' }
    ProjectSummary:
      allOf:
        - $ref: '#/components/schemas/ProjectCreate'
        - type: object
          required: [id, classId, status, teachers, version]
          properties:
            id: { type: string, format: uuid }
            classId: { type: string, format: uuid }
            status: { type: string, enum: [DRAFT, FINALIZED] }
            teachers: { type: array, items: { $ref: '#/components/schemas/PedTeacher' } }
            version: { type: integer, format: int64 }
    Project:
      allOf:
        - $ref: '#/components/schemas/ProjectSummary'
        - type: object
          required: [className, archived, ageRange, generalObjective, specificObjectives, activities, conclusion, createdAt, updatedAt]
          properties:
            className: { type: string }
            archived: { type: boolean }
            ageRange: { type: string, maxLength: 200 }
            generalObjective: { $ref: '#/components/schemas/ProjectRichText' }
            specificObjectives: { type: array, maxItems: 100, items: { type: string, maxLength: 2000 } }
            activities: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/ProjectActivity' } }
            conclusion: { $ref: '#/components/schemas/ProjectRichText' }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    Role:
      type: string
      enum: [REQUESTER, AGENT, MANAGER, ADMIN]
    TicketStatus:
      type: string
      enum: [OPEN, IN_PROGRESS, WAITING_REQUESTER, RESOLVED]
    CommentVisibility:
      type: string
      enum: [PUBLIC, INTERNAL]
    NotificationType:
      type: string
      enum: [ASSIGNED, PUBLIC_COMMENT, MENTION, STATUS_CHANGED, DEADLINE_SOON, OVERDUE]
    AttachmentScanStatus:
      type: string
      description: Novos anexos do MVP usam NOT_SCANNED (sem varredura antimalware). Os demais valores são legados.
      enum: [NOT_SCANNED, CLEAN, INFECTED, ERROR]
    AgendaItemKind:
      type: string
      enum: [INTERNAL_DEMAND, INSTITUTION_EVENT]
    AgendaItemPriority:
      type: string
      enum: [LOW, MEDIUM, HIGH]
    AgendaShift:
      type: [string, "null"]
      enum: [MORNING, AFTERNOON, NIGHT, null]
      description: Turno diário no fuso institucional (06–12, 12–18, 18–00). Exclusivo de demandas com allDay=false. startAt e endAt delimitam o primeiro e último turno; ausência ou null desativa o turno.
    AgendaItemStatus:
      type: string
      enum: [PENDING, COMPLETED]
    Theme:
      type: object
      required: [primaryColor, accentColor, sidebarColor, canvasColor]
      properties:
        primaryColor: { type: string, pattern: "^#[0-9A-Fa-f]{6}$" }
        accentColor: { type: string, pattern: "^#[0-9A-Fa-f]{6}$" }
        sidebarColor: { type: string, pattern: "^#[0-9A-Fa-f]{6}$" }
        canvasColor: { type: string, pattern: "^#[0-9A-Fa-f]{6}$" }
    PublicSettings:
      type: object
      required: [institutionName, timezoneName, theme, version, updatedAt]
      properties:
        schoolLogoUrl: { type: [string, "null"] }
        institutionName: { type: string }
        supportEmail: { type: [string, "null"], format: email }
        supportPhone: { type: [string, "null"] }
        timezoneName: { type: string }
        theme: { $ref: "#/components/schemas/Theme" }
        loginBackgroundUrl: { type: [string, "null"] }
        version: { type: integer, format: int64 }
        updatedAt: { type: string, format: date-time }
    SmtpSettings:
      type: object
      required: [tls, passwordConfigured]
      properties:
        host: { type: [string, "null"] }
        port: { type: [integer, "null"] }
        tls: { type: boolean }
        fromName: { type: [string, "null"] }
        fromAddress: { type: [string, "null"], format: email }
        username: { type: [string, "null"] }
        passwordConfigured: { type: boolean }
    AdminSettings:
      type: object
      required: [institutionName, timezoneName, attachmentLimitMb, reopenDays, theme, loginBackgroundConfigured, smtp, version, updatedAt]
      properties:
        schoolLogoUrl: { type: [string, "null"] }
        institutionName: { type: string }
        supportEmail: { type: [string, "null"], format: email }
        supportPhone: { type: [string, "null"] }
        timezoneName: { type: string }
        attachmentLimitMb: { type: integer }
        reopenDays: { type: integer }
        theme: { $ref: "#/components/schemas/Theme" }
        loginBackgroundConfigured: { type: boolean }
        smtp: { $ref: "#/components/schemas/SmtpSettings" }
        version: { type: integer, format: int64 }
        updatedAt: { type: string, format: date-time }
    Me:
      type: object
      required: [id, email, displayName, roles, passwordChangeRequired]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: string }
        roles:
          type: array
          uniqueItems: true
          items: { $ref: "#/components/schemas/Role" }
        passwordChangeRequired: { type: boolean }
    User:
      type: object
      required: [id, email, displayName, roles, active, passwordChangeRequired, anonymized, createdAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: string }
        roles:
          type: array
          uniqueItems: true
          items: { $ref: "#/components/schemas/Role" }
        active: { type: boolean }
        passwordChangeRequired: { type: boolean }
        anonymized: { type: boolean }
        createdAt: { type: string, format: date-time }
    Assignee:
      type: object
      required: [id, displayName]
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string }
    AgendaOccurrence:
      type: object
      required: [id, date, body, createdById, createdByName, version, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        date: { type: string, format: date, description: Data civil na instituição, sem horário. }
        body: { type: string, minLength: 1, maxLength: 4000 }
        createdById: { type: string, format: uuid }
        createdByName: { type: string }
        version: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AgendaOccurrenceInput:
      type: object
      required: [date, body]
      properties:
        date: { type: string, format: date }
        body: { type: string, minLength: 1, maxLength: 4000 }
    AgendaOccurrenceUpdate:
      allOf:
        - { $ref: "#/components/schemas/AgendaOccurrenceInput" }
        - type: object
          required: [version]
          properties:
            version: { type: integer, format: int64 }
    AgendaItem:
      type: object
      required: [id, kind, title, description, location, assigneeId, assigneeName, assignees, status, priority, startAt, endAt, allDay, version, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/AgendaItemKind" }
        title: { type: string }
        description: { type: [string, "null"] }
        location: { type: [string, "null"] }
        assigneeId: { type: [string, "null"], format: uuid }
        assigneeName: { type: [string, "null"] }
        assignees:
          type: array
          items: { $ref: "#/components/schemas/Assignee" }
          description: Responsáveis na ordem selecionada. Campos singulares legados refletem a primeira pessoa.
        status:
          oneOf:
            - { $ref: "#/components/schemas/AgendaItemStatus" }
            - { type: "null" }
        priority:
          description: Prioridade da demanda. Na criação, ausente ou nula assume MEDIUM; na atualização, preserva o valor existente. Eventos aceitam somente ausência ou null.
          oneOf:
            - { $ref: "#/components/schemas/AgendaItemPriority" }
            - { type: "null" }
        startAt: { type: string, format: date-time, description: Início inclusivo em UTC. }
        endAt: { type: string, format: date-time, description: Término exclusivo em UTC. }
        shift: { $ref: "#/components/schemas/AgendaShift" }
        allDay: { type: boolean }
        version: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    InstitutionEventInput:
      type: object
      required: [kind, title, startAt, endAt, allDay]
      properties:
        kind: { type: string, const: INSTITUTION_EVENT }
        title: { type: string, minLength: 1, maxLength: 160 }
        description: { type: [string, "null"], maxLength: 4000 }
        location: { type: [string, "null"], maxLength: 200 }
        assigneeIds:
          type: array
          maxItems: 0
          items: { type: string, format: uuid }
          description: Lista substitui as atribuições; vazia limpa. Sem lista usa assigneeId legado, preservando as demais pessoas quando o primeiro responsável é repetido. IDs duplicados são deduplicados. Campo singular preenchido junto da lista deve corresponder ao primeiro ID.
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        priority: { type: "null" }
        shift: { type: "null" }
        allDay: { type: boolean }
      additionalProperties: false
    InternalDemandInput:
      type: object
      required: [kind, title, startAt, endAt, allDay]
      properties:
        kind: { type: string, const: INTERNAL_DEMAND }
        title: { type: string, minLength: 1, maxLength: 160 }
        description: { type: [string, "null"], maxLength: 4000 }
        assigneeId: { type: [string, "null"], format: uuid }
        priority:
          description: Prioridade da demanda. Na criação, ausente ou nula assume MEDIUM; na atualização, preserva o valor existente. Eventos aceitam somente ausência ou null.
          oneOf:
            - { $ref: "#/components/schemas/AgendaItemPriority" }
            - { type: "null" }
        assigneeIds:
          type: array
          maxItems: 100
          items: { type: string, format: uuid }
          description: Lista substitui as atribuições; vazia limpa. Sem lista usa assigneeId legado, preservando as demais pessoas quando o primeiro responsável é repetido. IDs duplicados são deduplicados. Campo singular preenchido junto da lista deve corresponder ao primeiro ID.
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        shift: { $ref: "#/components/schemas/AgendaShift" }
        allDay: { type: boolean }
      additionalProperties: false
    AgendaItemCreate:
      oneOf:
        - { $ref: "#/components/schemas/InstitutionEventInput" }
        - { $ref: "#/components/schemas/InternalDemandInput" }
      discriminator:
        propertyName: kind
        mapping:
          INSTITUTION_EVENT: "#/components/schemas/InstitutionEventInput"
          INTERNAL_DEMAND: "#/components/schemas/InternalDemandInput"
    AgendaItemUpdate:
      type: object
      required: [title, startAt, endAt, allDay, version]
      properties:
        title: { type: string, minLength: 1, maxLength: 160 }
        description: { type: [string, "null"], maxLength: 4000 }
        location: { type: [string, "null"], maxLength: 200 }
        assigneeId: { type: [string, "null"], format: uuid }
        priority:
          description: Prioridade da demanda. Na criação, ausente ou nula assume MEDIUM; na atualização, preserva o valor existente. Eventos aceitam somente ausência ou null.
          oneOf:
            - { $ref: "#/components/schemas/AgendaItemPriority" }
            - { type: "null" }
        assigneeIds:
          type: array
          maxItems: 100
          items: { type: string, format: uuid }
          description: Lista substitui as atribuições; vazia limpa. Sem lista usa assigneeId legado, preservando as demais pessoas quando o primeiro responsável é repetido. IDs duplicados são deduplicados. Campo singular preenchido junto da lista deve corresponder ao primeiro ID.
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        shift: { $ref: "#/components/schemas/AgendaShift" }
        allDay: { type: boolean }
        version: { type: integer, format: int64 }
    CreatedUser:
      type: object
      required: [user, temporaryPassword]
      properties:
        user: { $ref: "#/components/schemas/User" }
        temporaryPassword: { type: string, writeOnly: true }
    Category:
      type: object
      required: [id, name, active, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
    Attachment:
      type: object
      required: [id, ticketId, originalName, mediaType, fileSize, sha256, scanStatus, visibility, createdAt]
      properties:
        id: { type: string, format: uuid }
        ticketId: { type: string, format: uuid }
        commentId: { type: [string, "null"], format: uuid }
        originalName: { type: string }
        mediaType: { type: string }
        fileSize: { type: integer, format: int64 }
        sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
        scanStatus: { $ref: "#/components/schemas/AttachmentScanStatus" }
        visibility: { $ref: "#/components/schemas/CommentVisibility" }
        createdAt: { type: string, format: date-time }
    TicketComment:
      type: object
      required: [id, authorId, body, visibility, createdAt, attachments]
      properties:
        id: { type: string, format: uuid }
        authorId: { type: string, format: uuid }
        authorName: { type: [string, "null"] }
        body: { type: string }
        visibility: { $ref: "#/components/schemas/CommentVisibility" }
        createdAt: { type: string, format: date-time }
        attachments:
          type: array
          items: { $ref: "#/components/schemas/Attachment" }
    TicketSummary:
      type: object
      required: [id, publicNumber, status, requesterId, createdAt, updatedAt, version]
      properties:
        id: { type: string, format: uuid }
        publicNumber: { type: string, example: SD-2026-000001 }
        status: { $ref: "#/components/schemas/TicketStatus" }
        requesterId: { type: string, format: uuid }
        requesterName: { type: [string, "null"] }
        assigneeId: { type: [string, "null"], format: uuid }
        assigneeName: { type: [string, "null"] }
        categoryId: { type: [string, "null"], format: uuid }
        categoryName: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, format: int64 }
    TicketDetail:
      allOf:
        - { $ref: "#/components/schemas/TicketSummary" }
        - type: object
          required: [description, attachments, comments]
          properties:
            description: { type: string }
            attachments:
              type: array
              items: { $ref: "#/components/schemas/Attachment" }
            comments:
              type: array
              items: { $ref: "#/components/schemas/TicketComment" }
    Notification:
      type: object
      required: [id, type, title, message, read, createdAt]
      properties:
        id: { type: string, format: uuid }
        ticketId: { type: [string, "null"], format: uuid }
        type: { $ref: "#/components/schemas/NotificationType" }
        title: { type: string }
        message: { type: string }
        read: { type: boolean }
        createdAt: { type: string, format: date-time }
    AuditEvent:
      type: object
      required: [id, action, entityType, createdAt]
      properties:
        id: { type: string, format: uuid }
        actorId: { type: [string, "null"], format: uuid }
        action: { type: string }
        entityType: { type: string }
        entityId: { type: [string, "null"] }
        details: { type: [string, "null"] }
        correlationId: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
    TicketPage:
      type: object
      required: [content, number, size, totalElements, totalPages]
      properties:
        content: { type: array, items: { $ref: "#/components/schemas/TicketSummary" } }
        number: { type: integer }
        size: { type: integer }
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer }
    UserPage:
      type: object
      required: [content, number, size, totalElements, totalPages]
      properties:
        content: { type: array, items: { $ref: "#/components/schemas/User" } }
        number: { type: integer }
        size: { type: integer }
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer }
    NotificationPage:
      type: object
      required: [content, number, size, totalElements, totalPages]
      properties:
        content: { type: array, items: { $ref: "#/components/schemas/Notification" } }
        number: { type: integer }
        size: { type: integer }
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer }
    AuditPage:
      type: object
      required: [content, number, size, totalElements, totalPages]
      properties:
        content: { type: array, items: { $ref: "#/components/schemas/AuditEvent" } }
        number: { type: integer }
        size: { type: integer }
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer }
    ProblemDetail:
      type: object
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string, format: uri }
        correlationId: { type: [string, "null"] }
        errors: { type: object, additionalProperties: { type: string } }

    PedTeacher:
      type: object
      required:
      - id
      - displayName
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
    PedClass:
      type: object
      required:
      - id
      - name
      - archived
      - teachers
      - version
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        archived:
          type: boolean
        teachers:
          type: array
          items:
            $ref: '#/components/schemas/PedTeacher'
        version:
          type: integer
          format: int64
    PedClassInput:
      type: object
      required:
      - name
      - teacherIds
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        archived:
          type: boolean
        teacherIds:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 100
        version:
          type: integer
          format: int64
    PedDayInput:
      type: object
      required: []
      properties:
        noClass:
          type: boolean
        reason:
          type:
          - string
          - 'null'
          maxLength: 4000
        proposal:
          type:
          - string
          - 'null'
          maxLength: 10000
        objectives:
          type:
          - string
          - 'null'
          maxLength: 10000
        development:
          type:
          - string
          - 'null'
          maxLength: 10000
        resources:
          type:
          - string
          - 'null'
          maxLength: 10000
    PedDay:
      type: object
      required:
      - date
      - noClass
      properties:
        date:
          type: string
          format: date
        noClass:
          type: boolean
        reason:
          type:
          - string
          - 'null'
          maxLength: 4000
        proposal:
          type:
          - string
          - 'null'
          maxLength: 10000
        objectives:
          type:
          - string
          - 'null'
          maxLength: 10000
        development:
          type:
          - string
          - 'null'
          maxLength: 10000
        resources:
          type:
          - string
          - 'null'
          maxLength: 10000
    PedEdit:
      type: object
      required:
      - version
      - teacherIds
      - days
      properties:
        version:
          type: integer
          format: int64
        theme:
          type:
          - string
          - 'null'
          maxLength: 1000
        teacherIds:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 100
        days:
          type: array
          items:
            $ref: '#/components/schemas/PedDayInput'
          minItems: 5
          maxItems: 5
    PedVersion:
      type: object
      required:
      - version
      properties:
        version:
          type: integer
          format: int64
    PedSummary:
      type: object
      required:
      - id
      - classId
      - weekStart
      - weekEnd
      - status
      - teachers
      - version
      properties:
        id:
          type: string
          format: uuid
        classId:
          type: string
          format: uuid
        weekStart:
          type: string
          format: date
        weekEnd:
          type: string
          format: date
        theme:
          type:
          - string
          - 'null'
        status:
          type: string
          enum:
          - DRAFT
          - FINALIZED
        teachers:
          type: array
          items:
            $ref: '#/components/schemas/PedTeacher'
        version:
          type: integer
          format: int64
    PedPlan:
      type: object
      required:
      - id
      - classId
      - weekStart
      - weekEnd
      - status
      - teachers
      - version
      - className
      - archived
      - days
      properties:
        id:
          type: string
          format: uuid
        classId:
          type: string
          format: uuid
        weekStart:
          type: string
          format: date
        weekEnd:
          type: string
          format: date
        theme:
          type:
          - string
          - 'null'
        status:
          type: string
          enum:
          - DRAFT
          - FINALIZED
        teachers:
          type: array
          items:
            $ref: '#/components/schemas/PedTeacher'
        version:
          type: integer
          format: int64
        className:
          type: string
        archived:
          type: boolean
        days:
          type: array
          items:
            $ref: '#/components/schemas/PedDay'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ActivityPhoto:
      type: object
      required: [id, url, thumbnailUrl, width, height]
      properties:
        id: { type: string, format: uuid }
        url: { type: string }
        thumbnailUrl: { type: string }
        width: { type: integer }
        height: { type: integer }
    ActivityRecordInput:
      type: object
      required: [title, activityDate, retainedPhotoIds]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        activityDate: { type: string, format: date }
        version: { type: integer, format: int64, minimum: 0, description: Obrigatória na atualização. }
        retainedPhotoIds:
          type: array
          maxItems: 50
          uniqueItems: true
          items: { type: string, format: uuid }
          description: Fotos existentes a manter; ordem original preservada. Vazio na criação.
    ActivityRecord:
      type: object
      required: [id, classId, className, archived, title, activityDate, authorId, authorName, photos, version, canEdit, createdAt, updatedAt, attachmentLimitMb]
      properties:
        id: { type: string, format: uuid }
        classId: { type: string, format: uuid }
        className: { type: string }
        archived: { type: boolean }
        title: { type: string }
        activityDate: { type: string, format: date }
        authorId: { type: string, format: uuid }
        authorName: { type: string }
        photos:
          type: array
          items: { $ref: '#/components/schemas/ActivityPhoto' }
        version: { type: integer, format: int64 }
        canEdit: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        attachmentLimitMb: { type: integer }
    ActivityRecordSummary:
      type: object
      required: [id, classId, title, activityDate, authorName, photoCount, cover, version]
      properties:
        id: { type: string, format: uuid }
        classId: { type: string, format: uuid }
        title: { type: string }
        activityDate: { type: string, format: date }
        authorName: { type: string }
        photoCount: { type: integer }
        cover: { $ref: '#/components/schemas/ActivityPhoto' }
        version: { type: integer, format: int64 }
    ActivityRecordPage:
      type: object
      required: [items, page, totalPages, totalElements, attachmentLimitMb]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ActivityRecordSummary' }
        page: { type: integer }
        totalPages: { type: integer }
        totalElements: { type: integer, format: int64 }
        attachmentLimitMb: { type: integer }
paths:
  /pedagogical/classes/{id}/projects:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      summary: Listar projetos da turma
      description: ADMIN/MANAGER ou professora ativa atualmente alocada. Período por interseção, incluindo meses intermediários; mês exige ano. Ordem por início e criação decrescentes, com desempate pelo ID.
      parameters:
        - { name: year, in: query, schema: { type: integer, minimum: 1900, maximum: 9998 } }
        - { name: month, in: query, schema: { type: integer, minimum: 1, maximum: 12 } }
        - { name: status, in: query, schema: { type: string, enum: [DRAFT, FINALIZED] } }
        - { name: teacherId, in: query, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Projetos autorizados
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ProjectSummary' } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    post:
      summary: Criar projeto em rascunho
      description: Turma ativa; título não vazio e período entre 1900 e 9998. Permite vários projetos no mesmo período.
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectCreate' }
      responses:
        '201':
          description: Projeto criado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '400': { description: Campos inválidos. }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /pedagogical/projects/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    delete:
      summary: Excluir projeto
      description: Exclusão definitiva por ADMIN ou MANAGER ativos, em turma ativa. Aceita rascunhos e finalizados, exige a versão atual e audita sem conteúdo pedagógico.
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - name: version
          in: query
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '204': { description: Registro excluído. }
        '400': { description: Versão ausente ou inválida. }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Registro não encontrado. }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    get:
      summary: Consultar projeto autorizado
      responses:
        '200':
          description: Projeto
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Projeto não encontrado. }
    put:
      summary: Salvar rascunho do projeto
      description: Exige turma ativa, DRAFT e versão atual. Datas de atividades históricas devem pertencer ao período; desenvolvimento livre dispensa data e título. Linhas vazias dos objetivos são removidas ao salvar. Responsáveis históricas podem ser mantidas; novas exigem alocação e conta ativa. Seções incompletas são aceitas no rascunho.
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectInput' }
      responses:
        '200':
          description: Projeto salvo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '400': { description: Campos inválidos. }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Projeto não encontrado. }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /pedagogical/projects/{id}/finalize:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      summary: Finalizar projeto completo
      description: Exige turma ativa, DRAFT, versão atual, faixa etária, responsável, objetivo geral, objetivos específicos, desenvolvimento e conclusão. Atividades históricas datadas também exigem título. Mesmas permissões da edição.
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: { type: integer, format: int64 }
      responses:
        '200':
          description: Projeto finalizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '400': { description: Versão obrigatória. }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Projeto não encontrado. }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /pedagogical/projects/{id}/reopen:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      summary: Reabrir projeto finalizado
      description: Exige turma ativa, FINALIZED e versão atual. Mesmas permissões da edição.
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: { type: integer, format: int64 }
      responses:
        '200':
          description: Projeto reaberto
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '400': { description: Versão obrigatória. }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Projeto não encontrado. }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /public/settings:
    get:
      security: []
      summary: Obtém tema e dados públicos do login.
      responses:
        "200":
          description: Configuração pública.
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicSettings" }
  /public/settings/manifest.webmanifest:
    get:
      security: []
      summary: Obtém o manifesto do aplicativo com nome e ícones da escola.
      responses:
        "200":
          description: Manifesto público revalidado a cada acesso; URLs de ícones incluem a versão das configurações.
          content:
            application/manifest+json:
              schema:
                type: object
                required: [id, name, short_name, start_url, scope, display, background_color, theme_color, icons]
                properties:
                  id: { type: string, const: / }
                  name: { type: string }
                  short_name: { type: string }
                  start_url: { type: string, const: / }
                  scope: { type: string, const: / }
                  display: { type: string, const: standalone }
                  background_color: { type: string }
                  theme_color: { type: string }
                  icons:
                    type: array
                    items:
                      type: object
                      properties:
                        src: { type: string }
                        sizes: { type: string, enum: [192x192, 512x512] }
                        type: { type: string, const: image/png }
                        purpose: { type: string, const: 'any maskable' }
  /public/settings/app-icon/{size}.png:
    get:
      security: []
      summary: Gera o ícone quadrado a partir da logo ou usa o símbolo padrão da escola.
      parameters:
        - name: size
          in: path
          required: true
          schema: { type: integer, enum: [32, 180, 192, 512] }
        - name: v
          in: query
          description: Versão usada para renovar a URL; a imagem sempre reflete a configuração atual.
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: PNG com fundo branco e margens, sem distorcer a logo.
          content:
            image/png: { schema: { type: string, format: binary } }
        "404": { description: Tamanho não suportado. }
  /public/settings/login-background:
    get:
      security: []
      summary: Obtém a imagem configurada para o login.
      responses:
        "200":
          description: Imagem JPG, PNG ou WebP.
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        "404": { description: Imagem não configurada. }
  /auth/csrf:
    get:
      security: []
      summary: Emite o token CSRF e seu cookie correspondente.
      responses:
        "200":
          description: Token emitido.
          content:
            application/json:
              schema:
                type: object
                required: [headerName, token]
                properties:
                  headerName: { type: string }
                  token: { type: string }
  /auth/session:
    post:
      security: [{ csrfHeader: [] }]
      summary: Cria uma sessão server-side.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "200":
          description: Sessão criada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { description: Limite de tentativas excedido. }
    delete:
      security: [{ sessionCookie: [], csrfHeader: [] }]
      summary: Encerra a sessão atual.
      responses:
        "204": { description: Sessão encerrada. }
  /auth/me:
    get:
      summary: Obtém o usuário autenticado.
      responses:
        "200":
          description: Sessão atual.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /auth/password/change:
    post:
      security: [{ sessionCookie: [], csrfHeader: [] }]
      summary: Troca a senha do usuário autenticado.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, minLength: 8, maxLength: 128 }
      responses:
        "204": { description: Senha alterada. }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /auth/password/forgot:
    post:
      security: [{ csrfHeader: [] }]
      summary: Solicita recuperação sem revelar se a conta existe.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "204": { description: Solicitação processada. }
  /auth/password/reset:
    post:
      security: [{ csrfHeader: [] }]
      summary: Redefine a senha com token de uso único.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string }
                password: { type: string, minLength: 8, maxLength: 128 }
      responses:
        "204": { description: Senha redefinida. }
        "400": { $ref: "#/components/responses/BadRequest" }
  /categories:
    get:
      summary: Lista categorias ativas.
      responses:
        "200":
          description: Categorias ativas.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Category" } }
  /users/assignees:
    get:
      summary: Lista responsáveis ativos para a fila.
      responses:
        "200":
          description: Diretório operacional mínimo.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Assignee" } }
        "403": { $ref: "#/components/responses/Forbidden" }
  /users/managers:
    get:
      summary: Lista Administrativos ativos disponíveis como responsáveis de demandas internas.
      responses:
        "200":
          description: Diretório mínimo de Administrativos.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Assignee" } }
        "403": { $ref: "#/components/responses/Forbidden" }
  /agenda/occurrences:
    get:
      summary: Lista ocorrências diárias compartilhadas; exige MANAGER.
      parameters:
        - { name: start, in: query, required: true, description: Data inicial inclusiva., schema: { type: string, format: date } }
        - { name: end, in: query, required: true, description: Data final exclusiva., schema: { type: string, format: date } }
      responses:
        "200":
          description: Ocorrências ordenadas por data e criação.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/AgendaOccurrence" } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Unprocessable" }
    post:
      security: [{ sessionCookie: [], csrfHeader: [] }]
      summary: Cria ocorrência sem depender de uma tarefa; exige MANAGER.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgendaOccurrenceInput" }
      responses:
        "201":
          description: Ocorrência criada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgendaOccurrence" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /agenda/occurrences/{id}:
    patch:
      security: [{ sessionCookie: [], csrfHeader: [] }]
      summary: Edita ocorrência com controle de versão; exige MANAGER.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgendaOccurrenceUpdate" }
      responses:
        "200":
          description: Ocorrência atualizada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgendaOccurrence" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Ocorrência não encontrada. }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      security: [{ sessionCookie: [], csrfHeader: [] }]
      summary: Exclui ocorrência com controle de versão; exige MANAGER.
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { name: version, in: query, required: true, schema: { type: integer, format: int64 } }
      responses:
        "204": { description: Ocorrência excluída. }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Ocorrência não encontrada. }
        "409": { $ref: "#/components/responses/Conflict" }
  /agenda/items:
    get:
      summary: Lista itens sobrepostos ao período, filtrados pelo perfil no banco.
      description: MANAGER recebe eventos e demandas internas; REQUESTER recebe somente eventos institucionais.
      parameters:
        - name: start
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: end
          in: query
          required: true
          description: Limite exclusivo do período consultado.
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Itens visíveis em ordem cronológica.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/AgendaItem" } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Unprocessable" }
    post:
      security: [{ sessionCookie: [], csrfHeader: [] }]
      summary: Cria evento institucional ou demanda interna; exige MANAGER.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgendaItemCreate" }
      responses:
        "201":
          description: Item criado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgendaItem" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /agenda/items/{id}:
    patch:
      security: [{ sessionCookie: [], csrfHeader: [] }]
      summary: Atualiza os campos do item sem alterar seu tipo; exige MANAGER.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgendaItemUpdate" }
      responses:
        "200":
          description: Item atualizado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgendaItem" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Item não encontrado. }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
    delete:
      security: [{ sessionCookie: [], csrfHeader: [] }]
      summary: Exclui permanentemente um item; exige MANAGER.
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - name: version
          in: query
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "204": { description: Item excluído. }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Item não encontrado. }
        "409": { $ref: "#/components/responses/Conflict" }
  /agenda/items/{id}/status:
    patch:
      security: [{ sessionCookie: [], csrfHeader: [] }]
      summary: Conclui ou reabre uma demanda interna; exige MANAGER.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status, version]
              properties:
                status: { $ref: "#/components/schemas/AgendaItemStatus" }
                version: { type: integer, format: int64 }
      responses:
        "200":
          description: Andamento atualizado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgendaItem" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Item não encontrado. }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /tickets:
    get:
      summary: Lista solicitações conforme o escopo do usuário.
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Size" }
        - { name: sort, in: query, schema: { type: string, example: "updatedAt,desc" } }
        - { name: number, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/TicketStatus" } }
        - { name: categoryId, in: query, schema: { type: string, format: uuid } }
        - { name: assigneeId, in: query, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Página estável de solicitações.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TicketPage" }
    post:
      security: [{ sessionCookie: [], csrfHeader: [] }]
      summary: Abre uma solicitação com até cinco anexos.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [metadata]
              properties:
                metadata:
                  type: object
                  required: [categoryId, description]
                  properties:
                    description: { type: string, maxLength: 8000 }
                    categoryId: { type: string, format: uuid }
                files: { type: array, maxItems: 20, items: { type: string, format: binary } }
      responses:
        "200":
          description: Solicitação criada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TicketDetail" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /tickets/{id}:
    get:
      summary: Detalha uma solicitação respeitando ownership e notas internas.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Detalhe da solicitação.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TicketDetail" }
        "403": { $ref: "#/components/responses/Forbidden" }
